
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up and Contacts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Contacts</h2>
            <ul>
                <li onclick="selectContact('Ayesha')">Ayesha</li>
                <li onclick="selectContact('Ali')">Ali</li>
                <li onclick="selectContact('Sara')">Sara</li>
                <li onclick="selectContact('Hamza')">Hamza</li>
                <li onclick="selectContact('Zain')">Zain</li>
            </ul>
            <p id="contactMessage">Select a contact.</p>
        </aside>

        <main class="content">
            <h1>Create Your Account</h1>

            <form id="signupForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>

                <button type="submit">Sign Up</button>
            </form>

            <button type="button" onclick="showMessage()">Show Message</button>
            <p id="message"></p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
